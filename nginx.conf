server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Contact form submission + admin inbox, proxied to the contact-api service.
    location /contact/ {
        proxy_pass http://contact-api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GWT compiled JS — immutable, cache forever
    location ~* \.nocache\.js$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.cache\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Game assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|atlas)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(mp3|wav|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
