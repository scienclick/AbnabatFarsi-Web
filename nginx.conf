# HTTP: serve ACME challenge for cert renewal, redirect everything else to HTTPS
server {
    listen 80;
    server_name nabatfarsi.com www.nabatfarsi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the real app
server {
    listen 443 ssl;
    http2 on;
    server_name nabatfarsi.com www.nabatfarsi.com;

    ssl_certificate     /etc/letsencrypt/live/nabatfarsi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nabatfarsi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Contact form submission + admin inbox, proxied to the contact-api service.
    location /contact/ {
        proxy_pass http://contact-api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GWT compiled JS — immutable, cache forever
    location ~* \.nocache\.js$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.cache\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Game assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|atlas)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(mp3|wav|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
