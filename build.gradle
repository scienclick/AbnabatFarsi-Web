buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        // de.richsource.gradle.plugins:gwt-gradle-plugin:0.6 was only ever published to
        // jcenter/bintray, both shut down. org.docstr:gwt-gradle-plugin is the maintained
        // fork (same "gwt" plugin id / DSL) published to the Gradle Plugin Portal.
        classpath "org.docstr:gwt-gradle-plugin:1.1.31"
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "Nabat Farsi"
        gdxVersion = '1.12.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

project(":core") {
    apply plugin: "java"

    dependencies {
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}

project(":html") {
    apply plugin: "gwt"
    apply plugin: "war"

    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
        implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
        // gwt-user's binary jsinterop-annotations dependency ships .class files only; GWT needs
        // the actual .java source on the classpath to translate JsInterop-annotated gdx code.
        implementation "com.google.jsinterop:jsinterop-annotations:2.0.0:sources"
        implementation files('../core/src')
        implementation files('src')
    }

    // gdx-backend-gwt's POM hard-pins com.google.gwt:gwt-user:2.8.2. The gwt plugin
    // (gwtVersion below) already supplies the real GWT SDK as org.gwtproject:gwt-user/gwt-dev
    // 2.10.0, so exclude the transitive copy everywhere rather than end up with two
    // different-GAV copies of gwt-user on the compile classpath at once (which breaks GWT
    // compilation with mismatched JRE emulation classes).
    configurations.all {
        exclude group: "com.google.gwt", module: "gwt-user"
    }

    gwt {
        gwtVersion = "2.10.0"
        maxHeapSize = "1G"
        sourceLevel = 1.8

        modules "com.nabatfarsi.GdxDefinition"
        devModules "com.nabatfarsi.GdxDefinitionSuperdev"

        superDev {
            port = 9876
        }

        compiler {
            strict = true
            disableCastChecking = true
        }
    }
}

tasks.eclipse.doLast {
    delete ".project"
}
